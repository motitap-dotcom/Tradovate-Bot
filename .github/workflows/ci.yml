name: CI — Tests & Lint

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Create dummy .env for tests
        run: cp .env.example .env

      - name: Syntax check all Python files
        run: |
          python -m py_compile bot.py
          python -m py_compile tradovate_api.py
          python -m py_compile strategies.py
          python -m py_compile risk_manager.py
          python -m py_compile config.py
          python -m py_compile trade_journal.py
          python -m py_compile auto_tuner.py
          python -m py_compile dashboard.py
          python -m py_compile status.py
          echo "All Python files compile successfully"

      - name: Run test suite with coverage
        continue-on-error: true
        run: |
          coverage run --source=. \
            --omit='test_all.py,check_*.py,get_token.py,verify_bot.py,monitor.py,publish_dashboard.py,browser_bot.py,dashboard.py,connection_check.py' \
            test_all.py

      - name: Enforce coverage floor (48%)
        # Baseline is ~49% (2026-04-22). Floor is set just below to prevent
        # regressions. Ratchet up as coverage on tradovate_api.py, bot.py,
        # and bot_health_check.py improves.
        run: |
          coverage report --fail-under=48
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage HTML report
        if: matrix.python-version == '3.12'
        run: coverage html -d coverage_html
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 14
