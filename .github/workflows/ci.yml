name: CI — Tests & Lint

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dummy .env for tests
        run: cp .env.example .env

      - name: Syntax check all Python files
        run: |
          python -m py_compile bot.py
          python -m py_compile tradovate_api.py
          python -m py_compile strategies.py
          python -m py_compile risk_manager.py
          python -m py_compile config.py
          python -m py_compile trade_journal.py
          python -m py_compile auto_tuner.py
          python -m py_compile dashboard.py
          python -m py_compile status.py
          echo "All Python files compile successfully"

      - name: Validate config values
        run: |
          python -c "
          import config
          from tradovate_api import YAHOO_SYMBOLS

          errors = []
          for sym, spec in config.CONTRACT_SPECS.items():
              if not spec.get('enabled'):
                  continue
              # Every enabled symbol must have valid risk params
              if spec.get('stop_loss_points', 0) <= 0:
                  errors.append(f'{sym}: stop_loss_points must be > 0')
              if spec.get('take_profit_points', 0) <= 0:
                  errors.append(f'{sym}: take_profit_points must be > 0')
              if spec.get('point_value', 0) <= 0:
                  errors.append(f'{sym}: point_value must be > 0')
              if spec.get('max_qty', 999) <= 0:
                  errors.append(f'{sym}: max_qty must be > 0')
              # Must have Yahoo mapping for warmup
              if sym not in YAHOO_SYMBOLS:
                  errors.append(f'{sym}: no Yahoo symbol mapping (warmup will fail)')

          # Global settings
          if config.RISK_PER_TRADE_PCT <= 0 or config.RISK_PER_TRADE_PCT > 0.05:
              errors.append(f'RISK_PER_TRADE_PCT={config.RISK_PER_TRADE_PCT} — must be 0 < x <= 0.05')
          if config.ACTIVE_CHALLENGE['max_contracts'] <= 0:
              errors.append('max_contracts must be > 0')
          if config.ACTIVE_CHALLENGE['account_size'] <= 0:
              errors.append('account_size must be > 0')

          if errors:
              print('CONFIG VALIDATION FAILED:')
              for e in errors:
                  print(f'  - {e}')
              exit(1)
          else:
              enabled = [s for s,sp in config.CONTRACT_SPECS.items() if sp.get('enabled')]
              print(f'Config OK: {len(enabled)} enabled symbols: {enabled}')
              print(f'  RISK_PER_TRADE_PCT={config.RISK_PER_TRADE_PCT}')
              print(f'  max_contracts={config.ACTIVE_CHALLENGE[\"max_contracts\"]}')
          "

      - name: Run test suite
        continue-on-error: true
        run: python test_all.py
