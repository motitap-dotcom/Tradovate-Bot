name: Morning Trading Check

# Runs at market open and verifies the bot is healthy AND trading.
# Phase 1 (09:45 ET): Health check + auto-fix — process, auth, WebSocket
# Phase 2 (10:15 ET): Trading check — signals generated, strategies active
# Phase 3 (11:00 ET): Final check — confirm actual trades executed
#
# Auto-fix logic: tries restart ONCE per phase if fixable issue found.
# Only restarts for clear failures (bot down, WS flapping, warmup failed).
# Never restarts for "no trades" — could be normal market conditions.
# Creates GitHub issue only if auto-fix fails or problem persists.

on:
  schedule:
    # 09:45 ET = 13:45 UTC (Phase 1)
    - cron: '45 13 * * 1-5'
    # 10:15 ET = 14:15 UTC (Phase 2)
    - cron: '15 14 * * 1-5'
    # 11:00 ET = 15:00 UTC (Phase 3)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  BOT_DIR: /root/tradovate-bot

jobs:
  trading-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Determine check phase
        id: phase
        run: |
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" -le 13 ]; then
            echo "phase=1" >> $GITHUB_OUTPUT
            echo "phase_name=Health Check (09:45 ET)" >> $GITHUB_OUTPUT
          elif [ "$HOUR_UTC" -le 14 ]; then
            echo "phase=2" >> $GITHUB_OUTPUT
            echo "phase_name=Signal Check (10:15 ET)" >> $GITHUB_OUTPUT
          else
            echo "phase=3" >> $GITHUB_OUTPUT
            echo "phase_name=Trading Check (11:00 ET)" >> $GITHUB_OUTPUT
          fi

      - name: SSH health check + auto-fix
        if: vars.SERVER_HOST != '' || secrets.VPS_HOST != ''
        id: check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.SERVER_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            #!/bin/bash
            set -euo pipefail
            BOT_DIR="${{ env.BOT_DIR }}"
            PHASE="${{ steps.phase.outputs.phase }}"
            SERVICE="tradovate-bot"
            RESTART_FLAG="$BOT_DIR/.morning_restart_$(date +%Y%m%d)"
            LIVE_STATUS="$BOT_DIR/live_status.json"

            echo "=== Morning Trading Check — Phase $PHASE ==="
            echo "Time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""

            FAILURES=""
            WARNINGS=""
            NEED_RESTART=false
            RESTART_REASON=""

            # ── Helper: safe restart (max 2 per day) ──
            do_restart() {
              local reason="$1"
              RESTARTS_TODAY=$(cat "$RESTART_FLAG" 2>/dev/null || echo "0")
              if [ "$RESTARTS_TODAY" -ge 2 ]; then
                echo "[SKIP] Restart skipped — already restarted $RESTARTS_TODAY times today"
                echo "  Reason was: $reason"
                FAILURES="${FAILURES}Wanted to restart ($reason) but hit daily limit ($RESTARTS_TODAY restarts)\n"
                return 1
              fi
              echo "[FIX] Restarting bot: $reason"
              systemctl restart "$SERVICE"
              sleep 10
              if systemctl is-active --quiet "$SERVICE"; then
                echo "[FIX] Restart SUCCESS"
                echo "$((RESTARTS_TODAY + 1))" > "$RESTART_FLAG"
                # Wait for warmup to complete
                echo "  Waiting 45s for warmup..."
                sleep 45
                WARNINGS="${WARNINGS}Auto-restarted: $reason\n"
                return 0
              else
                echo "[FAIL] Restart FAILED"
                FAILURES="${FAILURES}Auto-restart failed ($reason)\n"
                return 1
              fi
            }

            # ══════════════════════════════════════
            # CHECK 1: Bot process running
            # ══════════════════════════════════════
            if systemctl is-active --quiet "$SERVICE"; then
              UPTIME=$(systemctl show "$SERVICE" --property=ActiveEnterTimestamp --value)
              echo "[PASS] Bot process: RUNNING (since $UPTIME)"
            else
              echo "[FAIL] Bot process: DOWN"
              do_restart "process was down"
              # Re-check after restart
              if ! systemctl is-active --quiet "$SERVICE"; then
                FAILURES="${FAILURES}Bot process is DOWN and restart failed\n"
              fi
            fi

            # ══════════════════════════════════════
            # CHECK 2: Live status freshness
            # ══════════════════════════════════════
            if [ -f "$LIVE_STATUS" ]; then
              AGE=$(($(date +%s) - $(stat -c %Y "$LIVE_STATUS")))
              if [ "$AGE" -lt 120 ]; then
                echo "[PASS] Live status: fresh (${AGE}s old)"
              elif [ "$AGE" -lt 600 ]; then
                echo "[WARN] Live status: stale (${AGE}s old)"
                WARNINGS="${WARNINGS}Live status is ${AGE}s old\n"
              else
                echo "[FAIL] Live status: very stale (${AGE}s old) — bot may be frozen"
                NEED_RESTART=true
                RESTART_REASON="live_status frozen (${AGE}s old)"
              fi

              # Parse status fields
              BALANCE=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('balance', 0))" 2>/dev/null || echo "0")
              LOCKED=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('locked', False))" 2>/dev/null || echo "Unknown")
              INITIALIZED=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('balance_initialized', False))" 2>/dev/null || echo "Unknown")
              TRADES=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('trades_today', 0))" 2>/dev/null || echo "0")
              DAY_PNL=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('day_pnl', 0))" 2>/dev/null || echo "0")
              SYMBOLS=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(','.join(d.get('active_symbols', [])))" 2>/dev/null || echo "")
              DATA_SRC=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('market_data_source', 'unknown'))" 2>/dev/null || echo "unknown")

              # ── Check 3: Balance initialized ──
              if [ "$INITIALIZED" = "True" ]; then
                echo "[PASS] Balance initialized: \$$BALANCE"
              else
                echo "[FAIL] Balance NOT initialized"
                NEED_RESTART=true
                RESTART_REASON="balance not initialized"
              fi

              # ── Check 4: Not locked ──
              if [ "$LOCKED" = "False" ]; then
                echo "[PASS] Trading: not locked"
              else
                LOCK_REASON=$(python3 -c "import json; d=json.load(open('$LIVE_STATUS')); print(d.get('lock_reason', 'unknown'))" 2>/dev/null || echo "unknown")
                echo "[FAIL] Trading LOCKED: $LOCK_REASON"
                FAILURES="${FAILURES}Trading locked: $LOCK_REASON\n"
              fi

              # ── Check 5: Active symbols ──
              if echo "$SYMBOLS" | grep -q "MNQ" && echo "$SYMBOLS" | grep -q "MGC"; then
                echo "[PASS] Active symbols: $SYMBOLS"
              else
                echo "[WARN] Unexpected symbols: $SYMBOLS"
                WARNINGS="${WARNINGS}Expected MNQ,MGC in symbols but got: $SYMBOLS\n"
              fi

              echo "[INFO] Market data source: $DATA_SRC"
            else
              echo "[FAIL] Live status file not found"
              NEED_RESTART=true
              RESTART_REASON="live_status.json missing"
            fi

            # ══════════════════════════════════════
            # CHECK 6: WebSocket stability
            # ══════════════════════════════════════
            WS_DISCONNECTS=$(journalctl -u "$SERVICE" --since "30 min ago" --no-pager 2>/dev/null | grep -c "Connection to remote host was lost\|WebSocket closed" || echo "0")
            if [ "$WS_DISCONNECTS" -le 2 ]; then
              echo "[PASS] WebSocket disconnects (30min): $WS_DISCONNECTS"
            elif [ "$WS_DISCONNECTS" -le 5 ]; then
              echo "[WARN] WebSocket unstable: $WS_DISCONNECTS disconnects in 30min"
              WARNINGS="${WARNINGS}WebSocket disconnected ${WS_DISCONNECTS} times in 30min\n"
            else
              echo "[FAIL] WebSocket flapping: $WS_DISCONNECTS disconnects in 30min"
              NEED_RESTART=true
              RESTART_REASON="WebSocket flapping (${WS_DISCONNECTS} disconnects in 30min)"
            fi

            # ══════════════════════════════════════
            # CHECK 7: Auth health
            # ══════════════════════════════════════
            AUTH_COOLDOWNS=$(journalctl -u "$SERVICE" --since "30 min ago" --no-pager 2>/dev/null | grep -c "Auth cooldown set" || echo "0")
            if [ "$AUTH_COOLDOWNS" -eq 0 ]; then
              echo "[PASS] Auth: no cooldown events"
            elif [ "$AUTH_COOLDOWNS" -le 2 ]; then
              echo "[WARN] Auth cooldown triggered $AUTH_COOLDOWNS times"
              WARNINGS="${WARNINGS}Auth cooldown triggered ${AUTH_COOLDOWNS} times\n"
            else
              echo "[FAIL] Auth stuck in cooldown loop ($AUTH_COOLDOWNS events)"
              NEED_RESTART=true
              RESTART_REASON="auth stuck in cooldown loop"
            fi

            # ══════════════════════════════════════
            # CHECK 8: Log errors
            # ══════════════════════════════════════
            RECENT_ERRORS=$(journalctl -u "$SERVICE" --since "30 min ago" --no-pager 2>/dev/null | grep -c "\[ERROR\]" || echo "0")
            if [ "$RECENT_ERRORS" -le 3 ]; then
              echo "[PASS] Log errors (30min): $RECENT_ERRORS"
            else
              echo "[WARN] Log errors (30min): $RECENT_ERRORS"
              WARNINGS="${WARNINGS}${RECENT_ERRORS} errors in last 30 minutes\n"
              journalctl -u "$SERVICE" --since "30 min ago" --no-pager 2>/dev/null | grep "\[ERROR\]" | tail -3
            fi

            # ══════════════════════════════════════
            # CHECK 9: Token valid
            # ══════════════════════════════════════
            TOKEN_FILE="$BOT_DIR/.tradovate_token.json"
            if [ -f "$TOKEN_FILE" ]; then
              TOKEN_AGE=$(($(date +%s) - $(stat -c %Y "$TOKEN_FILE")))
              if [ "$TOKEN_AGE" -lt 5400 ]; then
                echo "[PASS] Token: fresh (${TOKEN_AGE}s old)"
              else
                echo "[WARN] Token: old (${TOKEN_AGE}s)"
                WARNINGS="${WARNINGS}Token is ${TOKEN_AGE}s old (>90min)\n"
              fi
            fi

            # ══════════════════════════════════════
            # PHASE 2+: Strategy checks
            # ══════════════════════════════════════
            if [ "$PHASE" -ge 2 ]; then
              SIGNALS=$(journalctl -u "$SERVICE" --since "60 min ago" --no-pager 2>/dev/null | grep -c "SIGNAL:" || echo "0")
              if [ "$SIGNALS" -gt 0 ]; then
                echo "[PASS] Signals in last hour: $SIGNALS"
              else
                echo "[WARN] No signals in last hour"
                WARNINGS="${WARNINGS}No signals generated in 60+ minutes since open\n"
              fi

              # ORB ranges
              ORB_RANGES=$(journalctl -u "$SERVICE" --since "60 min ago" --no-pager 2>/dev/null | grep -c "ORB.*range:" || echo "0")
              if [ "$ORB_RANGES" -gt 0 ]; then
                echo "[PASS] ORB ranges built: $ORB_RANGES"
              else
                echo "[WARN] No ORB ranges built — warmup may have failed"
                WARNINGS="${WARNINGS}No ORB ranges detected\n"
                NEED_RESTART=true
                RESTART_REASON="ORB warmup failed (no ranges built)"
              fi

              # ORB range rejections
              ORB_SKIPPED=$(journalctl -u "$SERVICE" --since "60 min ago" --no-pager 2>/dev/null | grep -c "skipped: range.*> max" || echo "0")
              if [ "$ORB_SKIPPED" -gt 0 ]; then
                echo "[WARN] ORB ranges rejected (too wide): $ORB_SKIPPED"
                WARNINGS="${WARNINGS}${ORB_SKIPPED} ORB ranges rejected as too wide\n"
              fi

              # VWAP stale
              VWAP_STALE=$(journalctl -u "$SERVICE" --since "30 min ago" --no-pager 2>/dev/null | grep -c "VWAP.*stale\|stale_bars" || echo "0")
              if [ "$VWAP_STALE" -eq 0 ]; then
                echo "[PASS] VWAP: not stale"
              else
                echo "[WARN] VWAP stale warnings: $VWAP_STALE"
                WARNINGS="${WARNINGS}VWAP stale warnings detected\n"
              fi
            fi

            # ══════════════════════════════════════
            # PHASE 3: Trade execution check
            # ══════════════════════════════════════
            if [ "$PHASE" -ge 3 ]; then
              if [ "$TRADES" -gt 0 ]; then
                echo "[PASS] Trades today: $TRADES (P&L: \$$DAY_PNL)"
              else
                echo "[WARN] No trades yet (90+ min since open)"
                WARNINGS="${WARNINGS}No trades executed 90+ minutes after market open\n"
              fi
            fi

            # ══════════════════════════════════════
            # AUTO-FIX: Restart if needed
            # ══════════════════════════════════════
            if [ "$NEED_RESTART" = true ]; then
              echo ""
              echo "=== AUTO-FIX: Restart needed ==="
              do_restart "$RESTART_REASON"
            fi

            # ══════════════════════════════════════
            # VERDICT
            # ══════════════════════════════════════
            echo ""
            echo "================================"
            if [ -n "$FAILURES" ]; then
              echo "VERDICT: FAILED"
              echo "Failures:"
              echo -e "$FAILURES"
              [ -n "$WARNINGS" ] && echo "Warnings:" && echo -e "$WARNINGS"
              exit 1
            elif [ -n "$WARNINGS" ]; then
              echo "VERDICT: WARNING (auto-fixed or non-critical)"
              echo "Warnings:"
              echo -e "$WARNINGS"
            else
              echo "VERDICT: HEALTHY"
            fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const phase = '${{ steps.phase.outputs.phase_name }}';
            const today = new Date().toISOString().split('T')[0];
            const title = `🚨 BOT ALERT: ${phase} FAILED (${today})`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bot-alert',
              per_page: 5,
            });
            const todayIssue = existing.data.find(i => i.title.includes(today));
            const body = `## Morning Trading Check Failed\n\n**Phase:** ${phase}\n**Date:** ${today}\n\nAuto-fix was attempted but the problem persists.\nSee [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.\n\nThis issue was created automatically.`;

            if (todayIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: `## ${phase}\n\n${body}`,
              });
            } else {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['bot-alert'],
                });
              } catch (e) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                });
              }
            }

      - name: Summary
        if: always()
        run: |
          PHASE_NAME="${{ steps.phase.outputs.phase_name }}"
          echo "## Morning Trading Check — $PHASE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Result: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Result: FAILED — GitHub Issue created" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Time (ET) | Checks | Auto-Fix |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | 09:45 | Process, auth, balance, WebSocket, token | Restart if down/frozen/flapping |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | 10:15 | + ORB ranges, VWAP health, signals | Restart if warmup failed |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | 11:00 | + actual trades executed | Alert only (no restart) |" >> $GITHUB_STEP_SUMMARY
